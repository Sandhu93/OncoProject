openapi: 3.1.0
info:
  title: OncoTrack foundation API
  version: 0.1.0
  description: >-
    Implemented routes: health, staff sign-in, sign-out and profile, and charts (issue, list, find by
    RT number). No stage-change or workflow API is exposed yet. OncoTrack holds no patient names or other patient information;
    a chart is identified only by its RT number. Every route except health and login needs a
    Bearer session token; a database failure while checking it returns 503, never access.
servers:
  - url: http://localhost:3000/api/v1
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Process is available
      security: []
      responses:
        '200':
          description: API process is running; no database dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Healthy'
  /health/ready:
    get:
      operationId: getReadiness
      summary: Database and initial migration are available
      security: []
      responses:
        '200':
          description: Initial schema is present
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Healthy'
        '503':
          description: Database is unavailable, unconfigured or unmigrated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unavailable'
  /auth/login:
    post:
      operationId: login
      summary: Sign in with a local staff username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing, mistyped or oversized username or password
        '401':
          description: Wrong username or password (the same answer for an unknown name)
        '429':
          description: Too many failed attempts for this name; try again later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockedOut'
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      security:
        - bearer: []
      responses:
        '204':
          description: Session revoked
        '401':
          description: Not signed in
  /auth/me:
    get:
      operationId: getCurrentStaff
      summary: The signed-in staff member, roles and capabilities
      security:
        - bearer: []
      responses:
        '200':
          description: Profile as held by the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffProfile'
        '401':
          description: Not signed in or session expired
  /charts:
    post:
      operationId: issueChart
      summary: Issue a chart (consultant). The RT number is typed in, never generated.
      security:
        - bearer: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: >-
            Retrying with the same key and body returns the first answer (header
            Idempotent-Replayed: true) for 24 hours. The same key with a different body is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueChartRequest'
      responses:
        '201':
          description: Chart created at the workflow's initial stage, with history, audit and outbox rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartSummary'
        '400':
          description: VALIDATION_FAILED (with field details) or IDEMPOTENCY_KEY_REQUIRED
        '401':
          description: Not signed in
        '403':
          description: ROLE_NOT_ALLOWED. Only a consultant can issue a chart (assumed, D-02)
        '409':
          description: RT_NUMBER_EXISTS, or WORKFLOW_NOT_ACTIVE until the consultant approves a workflow
        '422':
          description: IDEMPOTENCY_KEY_REUSED for a different request
    get:
      operationId: listCharts
      summary: List charts, urgent first, then the longest wait in the current stage
      security:
        - bearer: []
      parameters:
        - {
            name: q,
            in: query,
            schema: { type: string },
            description: Part of an RT number,
            any letter case,
          }
        - { name: status, in: query, schema: { enum: [OPEN, CLOSED, DISCONTINUED] } }
        - { name: stage, in: query, schema: { type: string }, description: Stage code }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: One page of charts and the total that match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartList'
        '400':
          description: VALIDATION_FAILED for an unknown status
        '401':
          description: Not signed in
  /charts/queue:
    get:
      operationId: getChartQueue
      summary: Every open chart, marked with what needs the signed-in person
      description: >-
        Charts that need the caller come first (urgent and longest-waiting first, charts in treatment last), then
        the rest in the same order. A chart needs the caller when one of their roles can take a step on it now.
      responses:
        '200':
          description: The queue and its totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartQueue'
        '401':
          description: Not signed in
  /notifications:
    get:
      operationId: listNotifications
      summary: The signed-in person's inbox, newest first
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        '200':
          description: The notifications and how many are unread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '401':
          description: Not signed in
  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      responses:
        '200':
          description: How many notifications are unread
          content:
            application/json:
              schema:
                type: object
                required: [unread]
                properties:
                  unread: { type: integer }
        '401':
          description: Not signed in
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      responses:
        '200':
          description: How many were marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  marked: { type: integer }
        '401':
          description: Not signed in
  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Marked read
        '401':
          description: Not signed in
        '404':
          description: NOTIFICATION_NOT_FOUND, including a notification that belongs to someone else
  /charts/by-number/{rtNumber}:
    get:
      operationId: getChartByNumber
      summary: One chart and its history, found by RT number in any letter case
      security:
        - bearer: []
      parameters:
        - { name: rtNumber, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The chart with its append-only history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartDetail'
        '401':
          description: Not signed in
        '404':
          description: CHART_NOT_FOUND
  /charts/by-number/{rtNumber}/comments:
    post:
      operationId: addChartComment
      summary: Add a comment to the chart's discussion
      description: |
        Anyone signed in can comment, on an open or a closed chart. Operational messages only, no patient details.
        With `forRole` that role is notified; without it, whoever the chart is waiting for is. The answer is the
        chart, with the new comment last in `comments`. The same `Idempotency-Key` returns the first answer.
      security:
        - bearer: []
      parameters:
        - { name: rtNumber, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 1000 }
                forRole:
                  type: [string, 'null']
                  enum:
                    [JUNIOR_RESIDENT, SENIOR_RESIDENT, CONSULTANT, PHYSICIST, RADIOGRAPHER, null]
      responses:
        '201':
          description: The chart with its discussion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartDetail'
        '400':
          description: VALIDATION_FAILED, with `details` as a list of { field, message }
        '401':
          description: Not signed in
        '404':
          description: CHART_NOT_FOUND
  /charts/by-number/{rtNumber}/actions/{action}:
    post:
      operationId: performChartAction
      summary: Record one step of the workflow, a Saturday update (POST_WEEKLY_UPDATE) or a final update after treatment (POST_FINAL_UPDATE)
      description: |
        The chart's own answer lists the steps the signed-in person can take now (`availableActions`), each with
        the fields to fill in, their defaults and limits. Send the values in `values`, with the chart `version`
        you saw in `expectedVersion`. The step, the stage change, its history row (with a plain-language summary),
        the audit event and the outbox event are written in one transaction. The same `Idempotency-Key` for the
        same request returns the first answer (`Idempotent-Replayed: true`). A step that passes the chart on also
        offers an optional `handoffNote` (up to 500 characters): it is kept in the chart's discussion and sent with
        the notice to whoever the chart goes to next.
      security:
        - bearer: []
      parameters:
        - { name: rtNumber, in: path, required: true, schema: { type: string } }
        - {
            name: action,
            in: path,
            required: true,
            schema: { type: string, example: GIVE_SIMULATION_DATES },
          }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, values]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                values:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '200':
          description: The chart after the step
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartDetail'
        '400':
          description: VALIDATION_FAILED, with `details` as a list of { field, message }
        '401':
          description: Not signed in
        '403':
          description: ROLE_NOT_ALLOWED or NOT_ASSIGNED
        '404':
          description: CHART_NOT_FOUND
        '409':
          description: CHART_CHANGED (the chart moved on since `expectedVersion`), ACTION_NOT_AVAILABLE (wrong stage), CHART_CLOSED, PREREQUISITES_MISSING (the patient cannot be told yet) or ALREADY_POSTED (this role's Saturday update for the week)
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Opaque session token from /auth/login. Only its SHA-256 is stored.
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 128
    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          const: Bearer
        expires_in:
          type: integer
          description: Seconds until the session expires
    IssueChartRequest:
      type: object
      additionalProperties: false
      required: [rtNumber, plannedSessions]
      properties:
        rtNumber:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9/._-]{0,39}$'
          description: Stored in capitals. Letters, digits and / . _ - only. Format still open (D-03).
        plannedSessions: { type: integer, minimum: 1, maximum: 100 }
        priority: { enum: [ROUTINE, URGENT], default: ROUTINE }
        planId: { type: string, maxLength: 60 }
        contourSetName: { type: string, maxLength: 60 }
        scanReference: { type: string, maxLength: 60 }
    NotificationItem:
      type: object
      required: [id, kind, message, rtNumber, createdAt, readAt]
      properties:
        id: { type: string, format: uuid }
        kind:
          {
            type: string,
            enum: [YOUR_TURN, SENT_BACK, ASSIGNED, STALLED, WEEKLY_DUE, COMMENT, FINISHED],
          }
        message: { type: string }
        rtNumber: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }
    NotificationList:
      type: object
      required: [items, unread]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NotificationItem' }
        unread: { type: integer }
    QueueItem:
      type: object
      required:
        [
          rtNumber,
          priority,
          stage,
          stageNumber,
          stageCount,
          daysInStage,
          stalled,
          needsYou,
          waitingOn,
          assignedToYou,
          weeklyMissing,
        ]
      properties:
        rtNumber: { type: string }
        priority: { type: string, enum: [ROUTINE, URGENT] }
        stage:
          type: object
          required: [code, label]
          properties:
            code: { type: string }
            label: { type: string }
        phase: { type: [string, 'null'] }
        stageNumber: { type: integer, description: Position of the stage in the workflow, from 1 }
        stageCount: { type: integer }
        daysInStage:
          {
            type: integer,
            description: Calendar days (India Standard Time) since the chart moved here,
          }
        stalled: { type: boolean, description: Waiting STALL_DAYS or more, outside treatment }
        needsYou: { type: boolean }
        nextStep: { type: [string, 'null'], description: What the caller can do, in plain words }
        waitingOn: { type: string }
        assignedTo: { type: [string, 'null'] }
        assignedToYou: { type: boolean }
        dateLine: { type: [string, 'null'] }
        treatmentDay: { type: [integer, 'null'] }
        sessionsDone: { type: [integer, 'null'] }
        plannedSessions: { type: [integer, 'null'] }
        weeklyMissing: { type: array, items: { type: string } }
    ChartQueue:
      type: object
      required: [stallDays, weekEnding, items, totals]
      properties:
        stallDays: { type: integer }
        weekEnding: { type: string, format: date }
        items:
          type: array
          items: { $ref: '#/components/schemas/QueueItem' }
        totals:
          type: object
          required: [open, gettingReady, stalled, inTreatment, saturdayUpdatesToCome]
          properties:
            open: { type: integer }
            gettingReady: { type: integer }
            stalled: { type: integer }
            inTreatment: { type: integer }
            saturdayUpdatesToCome: { type: integer }
    ChartSummary:
      type: object
      required:
        [
          id,
          rtNumber,
          stage,
          stageSince,
          minutesInStage,
          status,
          version,
          priority,
          issuedBy,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        rtNumber: { type: string }
        stage:
          type: object
          properties:
            code: { type: string }
            label: { type: string }
        stageSince: { type: string, format: date-time }
        minutesInStage: { type: integer }
        status: { enum: [OPEN, CLOSED, DISCONTINUED] }
        version: { type: integer }
        plannedSessions: { type: [integer, 'null'] }
        priority: { enum: [ROUTINE, URGENT] }
        planId: { type: [string, 'null'] }
        contourSetName: { type: [string, 'null'] }
        scanReference: { type: [string, 'null'] }
        phase:
          {
            type: [string, 'null'],
            description: 'Getting ready, Contouring, Planning or Treatment',
          }
        waitingFor:
          { type: [string, 'null'], description: 'What the chart is waiting for, in plain words' }
        ownerRole:
          type: [string, 'null']
          description: The role that takes the next step; null when tracking has ended
        issuedBy: { type: string }
        createdAt: { type: string, format: date-time }
    ChartDetail:
      allOf:
        - $ref: '#/components/schemas/ChartSummary'
        - type: object
          properties:
            controls:
              type: array
              description: |
                Consultant overrides, sent to the same endpoint as steps: REASSIGN_CONTOURING, RETURN_TO_STAGE,
                DISCONTINUE_CHART, REOPEN_CHART. Each needs a `reason`. Empty for anyone who is not a consultant.
              items:
                type: object
                description: Same shape as an entry of `availableActions`.
            comments:
              type: array
              description: The discussion, oldest first. A HANDOFF is the note left with a step that passed the chart on.
              items:
                type: object
                properties:
                  id: { type: string }
                  kind: { type: string, enum: [COMMENT, HANDOFF] }
                  body: { type: string }
                  authorName: { type: string }
                  authorRoles: { type: array, items: { type: string } }
                  forRole: { type: [string, 'null'] }
                  stageLabel: { type: string }
                  createdAt: { type: string, format: date-time }
            history:
              type: array
              items:
                type: object
                properties:
                  action: { type: string }
                  fromStage: { type: [string, 'null'] }
                  fromStageLabel: { type: [string, 'null'] }
                  toStage: { type: string }
                  toStageLabel: { type: string }
                  actorName: { type: string }
                  actorRoles: { type: array, items: { type: string } }
                  reason: { type: [string, 'null'] }
                  summary:
                    {
                      type: [string, 'null'],
                      description: 'One plain sentence of what was recorded',
                    }
                  occurredAt: { type: string, format: date-time }
            recorded:
              type: array
              description: The facts gathered so far, in the order the work happens
              items:
                type: object
                properties:
                  label: { type: string }
                  value: { type: string }
            weekly:
              type: [object, 'null']
              description: Who has posted this week's Saturday update; null when the stage asks for none
              properties:
                weekEnding: { type: string, format: date }
                updates:
                  type: array
                  items:
                    type: object
                    properties:
                      role: { type: string }
                      posted: { type: boolean }
            availableActions:
              type: array
              description: The steps the signed-in person can take now, with the fields to fill in
              items:
                type: object
                properties:
                  action: { type: string }
                  label: { type: string }
                  requiresReason: { type: boolean }
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        ok: { type: boolean }
                        detail: { type: string }
                  fields:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        label: { type: string }
                        type: { enum: [heading, text, area, date, time, number, select, staff] }
                        required: { type: boolean }
                        help: { type: string }
                        placeholder: { type: string }
                        maxLength: { type: integer }
                        min: { type: string }
                        max: { type: string }
                        default: { type: string }
                        options:
                          type: array
                          items:
                            type: object
                            properties:
                              value: { type: string }
                              label: { type: string }
                        staffRole: { type: string }
    ChartList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChartSummary'
        total: { type: integer }
    LockedOut:
      type: object
      properties:
        message:
          type: string
        retryAfterSeconds:
          type: integer
    StaffProfile:
      type: object
      required: [id, username, fullName, roles, capabilities]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        fullName:
          type: string
        roles:
          type: array
          items:
            enum: [JUNIOR_RESIDENT, SENIOR_RESIDENT, CONSULTANT, PHYSICIST, RADIOGRAPHER]
        capabilities:
          type: array
          items:
            enum: [MANAGE_STAFF, CONFIGURE_WORKFLOW, VIEW_AUDIT, EXPORT_REPORTS]
    Healthy:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          const: ok
        service:
          const: oncotrack-api
    Unavailable:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          const: unavailable
        service:
          const: oncotrack-api

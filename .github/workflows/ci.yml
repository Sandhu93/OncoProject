name: Development checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: oncotrack_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: oncotrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oncotrack_ci -d oncotrack_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://oncotrack_ci:synthetic-ci-only@127.0.0.1:5432/oncotrack_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-browser-test-results
          path: test-results/
          retention-days: 7
